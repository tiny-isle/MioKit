<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MioKit 架构图占位</title>
  <desc id="desc">用于替换为 MioKit 正式架构图的占位图</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="105" width="220" height="100" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
    <text x="200" y="165" font-size="28" fill="#1e3a8a">UI Hosts</text>
    <rect x="490" y="105" width="220" height="100" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/>
    <text x="600" y="165" font-size="28" fill="#166534">Core</text>
    <rect x="890" y="105" width="220" height="100" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="3"/>
    <text x="1000" y="165" font-size="28" fill="#854d0e">Contracts</text>
    <path d="M320 155 H480 M720 155 H880" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="490" y="315" width="220" height="100" rx="14" fill="#fce7f3" stroke="#f472b6" stroke-width="3"/>
    <text x="600" y="375" font-size="28" fill="#9d174d">Infrastructure</text>
    <path d="M600 215 V305" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="600" y="475" font-size="30" fill="#475569">正式架构图待补充</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
